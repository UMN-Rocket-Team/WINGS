name: Lib Build, Test, Format Check

on:
  push:
    paths:
      - 'wings_packet_parser/**'
  pull_request:
    paths:
      - 'wings_packet_parser/**'

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  server:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: wings_packet_parser

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev patchelf

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Format check
        run: cargo fmt --check
