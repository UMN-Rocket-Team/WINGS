name: Cargo Build, Test, Format Check

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  build_and_test:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libsoup2.4-dev librsvg2-dev libappindicator3-dev patchelf

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.74.1
          components: rustfmt

      - name: Ensure frontend dist exists
        run: mkdir -p ../dist

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Format check
        run: cargo fmt --check
