name: Cargo Build, Test, Format Check

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  frontend:
    runs-on: ubuntu-22.04
    
    strategy:
      matrix:
        node-version: [24]

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
      - name: Build frontend
        run: pnpm build

      - name: Test frontend
        run: pnpm test

      - name: Change directory to src-tauri
        run: cd ./src-tauri

      - name: Install native dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libsoup2.4-dev librsvg2-dev libappindicator3-dev patchelf

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Ensure frontend dist exists
        run: mkdir -p ../dist

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Format check
        run: cargo fmt --check
  server:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Format check
        run: cargo fmt --check
