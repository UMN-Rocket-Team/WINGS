name: Tauri Build, Test, Format Check

on:
  push:
    paths:
      - 'client/src-tauri/**'
  pull_request:
    paths:
      - 'client/src-tauri/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  tauri:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libsoup3.0-dev librsvg2-dev libappindicator3-dev patchelf

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Ensure frontend dist exists
        run: mkdir -p ../dist

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Format check
        run: cargo fmt --check
  server:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev patchelf

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Format check
        run: cargo fmt --check
