name: Cargo Build, Test, Format Check

on:
  push:
    paths:
      - client/**
  pull_request:
    paths:
      - client/**

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  server:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@26
          cache: true
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
