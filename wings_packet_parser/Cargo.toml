[package]
name = "wings_packet_parser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
csv = "1.4.0"
hex = "0.4.3"
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive", "serde_derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"

[dependencies.libftd2xx]
version = "0.32.3"
# statically link the vendor library, defaults to dynamic if not set
# this will make things "just work" on Linux and Windows
features = ["static"]